spring.application.name=fake-payment-gateway
server.port=9090

# Shared with the application under test, which verifies the X-Gateway-Signature header with it.
gateway.webhook-secret=affora-webhook-secret

# Where webhooks go when the charge request doesn't carry its own callbackUrl.
# Empty means "only send webhooks to an explicitly supplied URL".
gateway.default-callback-url=

# UC-19's eight seconds. Tests that need this to be quick lower it through POST /admin/config.
gateway.slow-response-millis=8000

# Meant to land after the hold has expired.
gateway.late-webhook-millis=60000

gateway.normal-webhook-millis=500

# Session 7 runs the gateway at 0.3.
gateway.failure-rate=0.0
