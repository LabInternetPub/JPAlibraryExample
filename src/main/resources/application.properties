spring.application.name=library

# Learning-environment simplification: Hibernate drops and creates the schema at every start,
# then data.sql loads the example data. Every start begins from the same known data.
spring.jpa.hibernate.ddl-auto=create
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Lazy data must be loaded inside the service transaction; services return DTOs.
spring.jpa.open-in-view=false

# The scenarios count statements, entity loads and collection fetches with Hibernate statistics.
spring.jpa.properties.hibernate.generate_statistics=true
logging.level.org.hibernate.engine.internal.StatisticalLoggingSessionEventListener=WARN

# The SQL log stays on so the class can read the statements while a scenario runs. It goes through
# a logger (not show-sql) so Measurement can silence it while timing: writing thousands of log
# lines would be measured as well.
logging.level.org.hibernate.SQL=DEBUG
spring.jpa.properties.hibernate.format_sql=true

# Errors are answered as application/problem+json.
spring.mvc.problemdetails.enabled=true

# The default port, written explicitly because scenarios.http and the README refer to it.
# Another application on 8080 (for example another Spring Boot project) must be stopped first.
server.port=8080

# Counts single JDBC statements and JDBC batches for the scenarios (see JdbcExecutionCounter).
spring.jpa.properties.hibernate.session.events.auto=cat.tecnocampus.library.scenario.JdbcExecutionCounter

# JDBC batching, configured for every use case. The naive import has it too and never uses it:
# auto-flush sends each insert alone. reWriteBatchedInserts lets the PostgreSQL driver turn a
# batch of INSERTs into multi-row INSERT statements.
spring.jpa.properties.hibernate.jdbc.batch_size=500
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.datasource.hikari.data-source-properties.reWriteBatchedInserts=true

# The 20,000-copy CSV is about 700 kB; the default limit is 1 MB.
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=9MB

# A transaction holds a database connection from start to end. With Hikari's default of 10, only
# 10 of the fifty simultaneous reservations could be inside a transaction at once: the pool size
# caps real concurrency. 60 lets all fifty run together (PostgreSQL accepts 100 by default).
spring.datasource.hikari.maximum-pool-size=60
