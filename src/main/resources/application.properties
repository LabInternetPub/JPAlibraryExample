spring.application.name=library

# Learning-environment simplification: Hibernate drops and creates the schema at every start,
# then data.sql loads the example data. Every start begins from the same known data.
spring.jpa.hibernate.ddl-auto=create
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Lazy data must be loaded inside the service transaction; services return DTOs.
spring.jpa.open-in-view=false

# The scenarios count statements, entity loads and collection fetches with Hibernate statistics.
spring.jpa.properties.hibernate.generate_statistics=true
logging.level.org.hibernate.engine.internal.StatisticalLoggingSessionEventListener=WARN

# The SQL log stays on so the class can read the statements while a scenario runs. It goes through
# a logger (not show-sql) so Measurement can silence it while timing: writing thousands of log
# lines would be measured as well.
logging.level.org.hibernate.SQL=DEBUG
spring.jpa.properties.hibernate.format_sql=true

# Errors are answered as application/problem+json.
spring.mvc.problemdetails.enabled=true

# 8081 (and PostgreSQL on 5433) so the example can run next to another project on the defaults.
server.port=8081

# Counts single JDBC statements and JDBC batches for the scenarios (see JdbcExecutionCounter).
spring.jpa.properties.hibernate.session.events.auto=cat.tecnocampus.library.scenario.JdbcExecutionCounter
